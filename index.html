<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "A Garantidora é um empréstimo? Vou endividar o condomínio?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Não. A Garantidora não é dívida e não entra no balanço como passivo. A ZARZUR assume a inadimplência futura e repassa 100% da arrecadação no dia combinado, cobrando uma porcentagem sobre o valor arrecadado. O condomínio não toma crédito nem precisa de aval."
      }
    },
    {
      "@type": "Question",
      "name": "Quanto custa?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Na Garantidora, a ZARZUR cobra uma porcentagem sobre a arrecadação mensal, a partir de 2,5%. O valor exato sai depois da análise do perfil do condomínio: número de unidades, histórico de inadimplência e valor das cotas. Na Compra Garantida você paga só pelo que precisou ser antecipado. No crédito para obra e na compra de dívida antiga, as condições são apresentadas caso a caso. A análise é gratuita."
      }
    },
    {
      "@type": "Question",
      "name": "Qual a diferença entre Garantidora e Compra Garantida?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Na Garantidora, a ZARZUR cobre 100% da inadimplência futura todos os meses, então o condomínio recebe cheio sempre. Na Compra Garantida, a cinco dias do fim do mês a ZARZUR antecipa só o que faltou entrar, e você fecha o mês completo pagando apenas pelo uso. A Compra Garantida costuma sair mais barata para quem tem inadimplência baixa ou pontual."
      }
    },
    {
      "@type": "Question",
      "name": "Como é feita a cobrança ao morador inadimplente?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A cobrança passa a ser conduzida pela ZARZUR, dentro da lei e de forma respeitosa, sem expor o morador perante o condomínio. O síndico deixa de ter o desgaste de cobrar vizinho e a relação na assembleia melhora."
      }
    },
    {
      "@type": "Question",
      "name": "O condomínio precisa trocar de administradora?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Não. A ZARZUR atua de forma complementar à administradora atual, sem interferir na gestão do dia a dia. Somamos a parte financeira; a rotina administrativa continua com quem já cuida dela."
      }
    },
    {
      "@type": "Question",
      "name": "Preciso aprovar em assembleia?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Em geral, sim. A contratação costuma passar pela assembleia. A ZARZUR prepara o material de apresentação com os números do seu condomínio para você levar à reunião e facilitar a aprovação. Fale com um especialista e receba esse material."
      }
    },
    {
      "@type": "Question",
      "name": "Qual o valor mínimo e o prazo do crédito para obras?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "O crédito para obras vai de R$ 30 mil a R$ 20 milhões, com prazo de até 60 meses, aprovação em até 7 dias, sem garantia real e sem aval dos condôminos."
      }
    },
    {
      "@type": "Question",
      "name": "A ZARZUR atua em quais regiões?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Temos atendimento presencial em São Paulo e no Espírito Santo, além de atendimento remoto. Fale com a ZARZUR para confirmar a disponibilidade na sua cidade."
      }
    }
  ]
}
